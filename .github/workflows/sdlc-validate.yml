# SDLC 하네스 필수 검사 (예시). 실제 강제력은 이 워크플로를 보호 브랜치의 required status check 로
# 지정했을 때만 생긴다 — docs/branch-protection.md. 배포 자격 증명은 이 워크플로에 주지 않는다.
name: sdlc-validate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness unit / acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Harness self-eval (auto cases)
        run: python scripts/sdlc.py eval
      - name: Validate every change (schema · ID · traceability · baseline drift · oracle lock · skip)
        run: |
          if [ -d .sdlc/changes ]; then python scripts/sdlc.py ci; else echo "no .sdlc/changes"; fi
      # 잠긴 QC 자산 변경: 사람 QA 라벨 또는 base 정책에 등록된 승인자(봇 포함)의 유효한 APPROVED 리뷰 필요
      - name: Protected QC assets changed in this PR → approval required
        if: startsWith(github.event_name, 'pull_request')
        env:
          # github.base_ref 는 pull_request_review 이벤트에서 비어 있다 — 두 이벤트 모두 채워지는 값을 쓴다
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/check_qc_assets.py
